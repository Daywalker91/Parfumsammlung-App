# Platzhalter-Werte — echte Werte kommen erst in der privaten Repository-
# Kopie dieser Datei rein (siehe gateway/README.md), niemals hier committen.
apiVersion: v1
kind: Secret
metadata:
  namespace: aromathek-gateway
  name: gateway-secret
  labels:
    app: gateway
type: Opaque
stringData:
  DB_USER: gateway
  DB_PASSWORD: "<wird-noch-gesetzt>"
  ADMIN_USER: admin
  ADMIN_PASSWORD: "<wird-noch-gesetzt>"
  GATEWAY_ENC_KEY: "<wird-noch-gesetzt>"
  PFSENSE_USER: "<wird-noch-gesetzt>"
