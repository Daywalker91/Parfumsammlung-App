# Platzhalter — echter Key kommt erst in der privaten Repository-Kopie
# dieser Datei rein (siehe gateway/README.md), niemals hier committen.
# ssh-privatekey ist der von Kubernetes für type: kubernetes.io/ssh-auth
# vorgeschriebene Schlüsselname (kein frei wählbarer Name).
apiVersion: v1
kind: Secret
metadata:
  namespace: aromathek-gateway
  name: gateway-pfsense-ssh-key
  labels:
    app: gateway
type: kubernetes.io/ssh-auth
stringData:
  ssh-privatekey: "<wird-noch-gesetzt>"
