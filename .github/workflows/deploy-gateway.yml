name: Deploy Gateway

# CI baut das Image und pusht es mit ZWEI Tags: dem Commit-SHA (unveränderlich,
# fürs Nachvollziehen/Rollback) und "latest" (mutable, immer der neueste Stand).
# Das Deployment-Manifest referenziert dauerhaft nur ":latest" und muss sich
# deshalb nie mehr ändern -- kein Zurückschreiben in Git nötig, kein
# Auseinanderlaufen zwischen dem öffentlichen Manifest und privaten Kopien
# davon (z. B. in einem separaten ArgoCD-Repo) mehr möglich.
#
# Kehrseite: ArgoCD sieht bei einem neuen ":latest"-Build keine Text-Änderung
# im Manifest und synct deshalb nichts automatisch neu aus. Nach einem
# Gateway-Code-Update muss der laufende Pod manuell neu gestartet werden,
# damit er das frische Image zieht:
#   kubectl rollout restart deployment/gateway -n aromathek-gateway
#
# Siehe gateway/README.md für die einmalige ArgoCD-Application-Einrichtung.
on:
  push:
    # Eigener Branch statt Stable/Experimental — App-Releases und
    # Gateway-Deploys haben unterschiedliche Lebenszyklen (siehe
    # gateway/README.md). Gateway-Arbeit läuft weiter auf Experimental,
    # ein Merge nach Gateway löst erst den eigentlichen Deploy aus.
    branches: [Gateway]
    paths:
      - "gateway/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest-Runner sind selbst amd64 — QEMU macht das Cross-Building
      # für arm64 (aktuelle Zielarchitektur der k3s-Nodes) möglich.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/daywalker91/parfumsammlung-gateway:${{ github.sha }}
            ghcr.io/daywalker91/parfumsammlung-gateway:latest
