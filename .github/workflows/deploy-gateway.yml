name: Deploy Gateway

# Reines GitOps: CI baut nur das Image und schreibt den neuen Tag zurück ins
# Deployment-Manifest (gateway/k8s/deployment.yaml). ArgoCD zieht sich die
# Manifeste aus diesem Repo-Pfad selbst — kein self-hosted Runner, kein
# Image Updater nötig, ArgoCD synct die Änderung wie jede andere.
# Siehe gateway/README.md für die einmalige ArgoCD-Application-Einrichtung.
on:
  push:
    # Eigener Branch statt Stable/Experimental — App-Releases und
    # Gateway-Deploys haben unterschiedliche Lebenszyklen (siehe
    # gateway/README.md). Gateway-Arbeit läuft weiter auf Experimental,
    # ein Merge nach Gateway löst erst den eigentlichen Deploy aus.
    branches: [Gateway]
    paths:
      - "gateway/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest-Runner sind selbst amd64 — QEMU macht das Cross-Building
      # für arm64 (aktuelle Zielarchitektur der k3s-Nodes) möglich.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/parfumsammlung-gateway:${{ github.sha }}

      # ArgoCD kennt nur, was in Git steht — der neue Image-Tag muss also ins
      # Manifest zurückgeschrieben werden, nicht nur in die Registry gepusht
      # werden. [skip ci] verhindert, dass dieser Commit den Workflow erneut
      # auslöst (gateway/** matcht sonst auch diese eigene Änderung).
      - name: Image-Tag im Deployment aktualisieren
        run: |
          git checkout -B "${{ github.ref_name }}"
          sed -i "s|image: ghcr.io/.*/parfumsammlung-gateway:.*|image: ghcr.io/${{ github.repository_owner }}/parfumsammlung-gateway:${{ github.sha }}|" gateway/k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gateway/k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "gateway: Image-Tag auf ${{ github.sha }} aktualisiert [skip ci]"
          git push origin "${{ github.ref_name }}"
