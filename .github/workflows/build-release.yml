name: Build & Release

# Siehe Parfum-App_CICD_Plan.md für die volle Erklärung des Branch-/Versionierungsmodells.
on:
  push:
    branches: [Stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Der Standard-GITHUB_TOKEN hat je nach Repo-Einstellung nur Lesezugriff;
    # zum Erstellen eines Release + Hochladen der APK wird Schreibzugriff auf
    # Contents gebraucht (sonst: "Resource not accessible by integration").
    permissions:
      contents: write
    # Guard: verhindert einen versehentlichen (Pre-)Release, falls workflow_dispatch
    # manuell von einem anderen Branch als Stable/Experimental ausgelöst wird.
    if: github.ref_name == 'Stable' || github.ref_name == 'Experimental'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle Tag-Historie nötig, um den letzten vX.Y-Tag zu finden

      # Sicherheitsnetz: falls der Wrapper mal wieder auf Windows neu erzeugt
      # wird und das Ausführungsbit dabei verloren geht (siehe Commit
      # "Fix gradlew missing executable bit").
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Determine version (X.Y scheme)
        id: version
        run: |
          LAST=$(git tag -l 'v*.*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n | tail -1)
          if [ -z "$LAST" ]; then X=0; Y=0; else X=${LAST%%.*}; Y=${LAST##*.}; fi

          if [ "${{ github.ref_name }}" = "Stable" ]; then
            X=$((X + 1)); Y=0
          else
            Y=$((Y + 1))
          fi

          echo "versionName=$X.$Y" >> "$GITHUB_OUTPUT"
          echo "versionCode=$((X * 10000 + Y))" >> "$GITHUB_OUTPUT"
          echo "tag=v$X.$Y" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      # Signierung läuft direkt über Gradle (app/build.gradle.kts), nicht über
      # eine Drittanbieter-Action — die zog auf dem Runner eine dort nicht
      # vorhandene, fest einprogrammierte Build-Tools-Version (29.0.3).
      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build & sign release APK
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            -PversionName=${{ steps.version.outputs.versionName }} \
            -PsigningStoreFile="$RUNNER_TEMP/release.keystore" \
            -PsigningStorePassword=${{ secrets.KEYSTORE_PASSWORD }} \
            -PsigningKeyAlias=${{ secrets.KEY_ALIAS }} \
            -PsigningKeyPassword=${{ secrets.KEY_PASSWORD }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ github.ref_name == 'Experimental' }}
          files: app/build/outputs/apk/release/*.apk
